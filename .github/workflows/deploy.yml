name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 官方 Pages 部署流程所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 站点是纯静态（Bulma 已内联在 web/assets/vendor/，无需构建），
      # 直接把 web/ 整目录作为部署产物上传，不开 gh-pages 分支。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
